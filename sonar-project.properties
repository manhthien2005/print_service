sonar.projectKey=manhthien2005_print_service
sonar.organization=manhthien2005
sonar.projectName=Print Service
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/types/**,**/*.d.ts

# Test files (nếu có)
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Test coverage (uncomment khi đã có test framework)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.testExecutionReportPaths=coverage/test-reporter.xml

# Quality Gate
sonar.qualitygate.wait=true

