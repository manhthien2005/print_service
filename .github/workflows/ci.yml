name: CI/CD Pipeline

on:
  push:
    branches: [develop, deploy]
  pull_request:
    branches: [deploy]

jobs:
  # Check Prettier & TypeScript (Next.js không tự làm)
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Prettier check
        run: npm run format:check
      
      - name: Type check
        run: npm run type-check

  # Build (Next.js tự chạy ESLint khi build)
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    # Chạy song song với check để tối ưu thời gian
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 1

  # SonarCloud - Chỉ chạy trên nhánh develop
  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Cần để SonarCloud phân tích đầy đủ
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Chỉ chạy khi PR vào nhánh deploy
  deploy-check:
    name: Deploy Check
    runs-on: ubuntu-latest
    needs: [check, build]
    if: github.event_name == 'pull_request' && github.base_ref == 'deploy'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "Build artifacts not found!"
            exit 1
          fi
          echo "✅ Build artifacts verified successfully"
      
      - name: Test deployment readiness
        run: |
          echo "✅ All checks passed - Ready for deployment"
          echo "This PR can be merged to deploy branch"

