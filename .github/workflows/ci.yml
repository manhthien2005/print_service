name: CI/CD Pipeline

on:
  push:
    branches: [develop, deploy]
  pull_request:
    branches: [deploy]

jobs:
  # Check Prettier & TypeScript (Next.js không tự làm)
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

  # Build (Next.js tự chạy ESLint khi build)
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    # Chạy song song với check để tối ưu thời gian
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 1

  # SonarCloud - Chỉ chạy trên nhánh develop
  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
    continue-on-error: true # Không fail pipeline nếu SonarCloud có lỗi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Cần để SonarCloud phân tích đầy đủ

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify SonarCloud configuration
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "❌ SONAR_TOKEN is not set in GitHub secrets"
            exit 1
          fi
          echo "✅ SONAR_TOKEN is configured"
          echo "Project Key: manhthien2005_print_service"
          echo "Organization: manhthien2005"
          echo "Branch: develop"

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Check SonarCloud result
        if: failure()
        run: |
          echo "⚠️  SonarCloud scan failed. Possible reasons:"
          echo "1. Project 'manhthien2005_print_service' does not exist on SonarCloud"
          echo "2. Organization 'manhthien2005' is incorrect"
          echo "3. SONAR_TOKEN does not have permission to access the project"
          echo "4. Free plan may not support branch analysis (develop branch)"
          echo ""
          echo "To fix this:"
          echo "1. Go to https://sonarcloud.io"
          echo "2. Verify project key: manhthien2005_print_service"
          echo "3. Ensure the organization is: manhthien2005"
          echo "4. Set 'develop' as main branch in SonarCloud project settings"
          echo "5. Verify the SONAR_TOKEN has access to this project"
          echo "6. Note: Free plan may only analyze main branch. Consider upgrading for branch analysis."

  # Chỉ chạy khi PR vào nhánh deploy
  deploy-check:
    name: Deploy Check
    runs-on: ubuntu-latest
    needs: [check, build]
    if: github.event_name == 'pull_request' && github.base_ref == 'deploy'
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .next

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "Build artifacts not found!"
            exit 1
          fi
          echo "✅ Build artifacts verified successfully"

      - name: Test deployment readiness
        run: |
          echo "✅ All checks passed - Ready for deployment"
          echo "This PR can be merged to deploy branch"
